---
name: "xepay-linux"
suites:
- "jammy"
architectures:
- "amd64"
packages:
- "curl"
- "g++"
- "git"
- "pkg-config"
- "autoconf"
- "libtool"
- "automake"
- "faketime"
- "bsdmainutils"
- "ca-certificates"
- "libssl-dev"
remotes:
- "url": "https://github.com/xepay-project/xepay.git"
  "dir": "xepay"
files: []
script: |
  set -e -o pipefail
  export PATH="$HOME/.cargo/bin:$PATH"
  export SOURCE_DATE_EPOCH=$(date -d "2026-01-01" +%s)
  cd xepay
  if ! command -v cargo >/dev/null 2>&1; then
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    . "$HOME/.cargo/env"
  fi
  RUSTFLAGS="--remap-path-prefix=$PWD=/build/xepay" \
    cargo build --release --bin xepay --bin xepayd
  mkdir -p dist
  cp target/release/xepay dist/
  cp target/release/xepayd dist/
  tar -czf xepay-linux-x64.tar.gz -C dist .
