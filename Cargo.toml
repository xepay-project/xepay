[workspace]
members = [
    ".",
    "crypto"
]

[package]
name = "xepay"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "XEPAY (XEPC) node, CLI, and miner"
license = "Apache-2.0"
repository = "https://github.com/xepay-project/xepay"
homepage = "https://github.com/xepay-project/xepay"
keywords = ["blockchain", "cryptocurrency", "p2p", "secp256k1"]
categories = ["cryptography::cryptocurrencies", "network-programming"]

[lib]
name = "xepay"
path = "src/lib.rs"

[[bin]]
name = "xepay"
path = "src/xepay.rs"

[[bin]]
name = "xepayd"
path = "src/bin/xepayd.rs"

[[bin]]
name = "xepay-miner"
path = "src/bin/xepay-miner.rs"

[[bin]]
name = "xepay-genesis"
path = "src/bin/xepay-genesis.rs"

[[test]]
name = "integration"
path = "src/tests/mod.rs"

[dependencies]
sha3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"
rand = "0.8"
secp256k1 = { version = "0.29", features = ["rand", "recovery"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "signal",
    "sync",
    "io-util",
] }
futures = "0.3"
xepay-crypto = { path = "crypto" }

# Address encoding.
bs58 = "0.5"
bech32 = "0.12"

# Daemonization.
nix = { version = "0.29", features = ["process", "signal"] }

# Storage.
eth_trie = "0.6"
rlp = "0.5"
rusty-leveldb = "1.0"
keccak-hash = "0.10"
alloy-primitives = "1"

# Smart Contract (VM) - Note: VM has been removed, but primitive-types is still used for U256 in some places.
primitive-types = "0.12"

# HD Wallet (XEPAY Standard)
bip39 = { version = "2.0", features = ["rand"] }
hmac = "0.12"

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[features]
skip-pow = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
debug = false

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.test]
opt-level = 0
debug = true
incremental = true
