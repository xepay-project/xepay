[package]
name = "xepay"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Aldianokto, Xepay Core developers"]
description = "XEPAY (ticker: XEPY) — a serious fast-block Layer-1 blockchain targeting ~15s block time, using SHA3-256."

[[bin]]
name = "xepay"
path = "xepay.rs"

[dependencies]
sha3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
chrono = "0.4"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
merkle_light = "0.4"
sled = "0.34"
