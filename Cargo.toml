[package]
name = "xepy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Aldianokto, Xepay Core developers"]
description = "XEPAY (XEPY) — a fast-block blockchain targeting ~15s block time, using SHA3-256."

[[bin]]
name = "xepy"
path = "xepay.rs"

[dependencies]
sha3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
chrono = "0.4"
hex = "0.4"
