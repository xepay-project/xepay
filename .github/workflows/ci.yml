name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release --locked --workspace

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Documentation tests
        run: cargo test --workspace --doc

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: xepay-linux-x64
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: xepay-linux-arm64
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: xepay-macos-x64
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: xepay-macos-arm64
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: xepay-windows-x64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --locked --version 0.2.5

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --locked --target ${{ matrix.target }} --bin xepay --bin xepayd --bin xepay-miner --bin xepay-genesis

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --locked --target ${{ matrix.target }} --bin xepay --bin xepayd --bin xepay-miner --bin xepay-genesis

      - name: Prepare artifact directory
        shell: bash
        run: |
          mkdir -p artifact
          for bin in xepay xepayd xepay-miner xepay-genesis; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}" artifact/
          done
          ls -la artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact/
          if-no-files-found: error
